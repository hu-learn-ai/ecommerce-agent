[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
# 中文内容字符串（提示词/FAQ/回复语）不适合强制折行，行长统一交给 ruff format 处理
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
# 项目统一使用 sys.path 引导模式（设置 PROJECT_ROOT 后才能导入项目模块），
# 允许模块级 import 出现在 sys.path 操作之后
"*.py" = ["E402"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
